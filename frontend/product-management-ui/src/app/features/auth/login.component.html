<section class="login-shell">
  <form class="card login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Product Management</h1>
    <div *ngIf="errorMessage" class="alert error">{{ errorMessage }}</div>
    <div class="field">
      <label>Tên đăng nhập</label>
      <input data-testid="login-username" formControlName="username" autocomplete="username">
      <small class="field-error" *ngIf="fieldError('username')">{{ fieldError('username') }}</small>
    </div>
    <div class="field">
      <label>Mật khẩu</label>
      <input data-testid="login-password" type="password" formControlName="password" autocomplete="current-password">
      <small class="field-error" *ngIf="fieldError('password')">{{ fieldError('password') }}</small>
    </div>
    <button data-testid="login-submit" class="btn primary login-submit" type="submit" [disabled]="loading">
      {{ loading ? 'Đang đăng nhập...' : 'Đăng nhập' }}
    </button>
  </form>
</section>
